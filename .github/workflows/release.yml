name: Release

# The tag is the release: Swift Package Manager and the Swift Package Index read git tags.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      # The release PR gets no pull_request runs (GITHUB_TOKEN), so start its required checks.
      - name: Run the required checks on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref release-please--branches--main
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref release-please--branches--main
