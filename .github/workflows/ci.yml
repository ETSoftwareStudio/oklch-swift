name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      # swift test covers macOS only; the UIKit and watchOS code paths need their own builds.
      - name: Build for iOS, tvOS, watchOS and visionOS
        run: |
          for platform in iOS tvOS watchOS visionOS; do
            echo "::group::$platform"
            xcodebuild build -quiet -scheme OKLCHColor -destination "generic/platform=$platform"
            echo "::endgroup::"
          done
