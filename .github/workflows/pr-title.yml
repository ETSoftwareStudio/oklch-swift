name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Skip release-please's PR
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF_NAME" = release-please--branches--main ]; then
            echo "release-please's PR: its title is generated, nothing to check."
            exit 0
          fi
          echo "::error::Only the Release workflow may start this check, on release-please's branch."
          exit 1

      - name: Check the title is a Conventional Commit
        id: title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._-]+\))?(!?): .+'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit, e.g. \"fix: clamp hue before mixing\"."
            echo "fix: and perf: make a patch release, feat: a minor one, feat!: a major one."
            exit 1
          fi
          echo "breaking=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'pull_request' && steps.title.outputs.breaking == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A source-breaking change breaks every app that updates, so it needs a major release.
      - name: Check the public API is unchanged or only extended
        if: github.event_name == 'pull_request' && steps.title.outputs.breaking == ''
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if output=$(swift package diagnose-api-breaking-changes "$BASE" 2>&1); then
            echo "$output" | tail -n 3
            exit 0
          fi
          echo "$output"
          if echo "$output" | grep -q 'API breakage'; then
            echo "::error::This PR breaks the public API (see above). Mark it breaking: \"feat!: ...\" or \"fix!: ...\"."
          fi
          exit 1
